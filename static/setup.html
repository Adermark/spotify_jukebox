<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jukebox Setup</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .step { margin-bottom: 16px; }
    .step h2 { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 1.15rem; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
    .num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); font-size: 0.9rem; flex-shrink: 0; }
    .step.done .num { background: var(--accent); color: var(--accent-text); }
    .step.locked { opacity: 0.5; }
    .step ol { padding-left: 22px; margin: 8px 0 16px; }
    .step li { margin-bottom: 8px; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    .field label { font-weight: 600; }
    .copy { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: var(--radius); padding: 6px 6px 6px 12px; margin-top: 4px; }
    .copy code { flex: 1; overflow-wrap: anywhere; }
    .note { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; margin: 8px 0; font-size: 0.92rem; }
    a { color: var(--accent); }
    .done-line { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1><img class="logo" src="/static/logo.png" alt=""> Jukebox setup</h1>
  <div id="content"><p class="muted">Loading…</p></div>
</main>
<div id="toast" class="hidden"></div>
<script src="/static/common.js"></script>
<script src="/static/setup.js"></script>
</body>
</html>
