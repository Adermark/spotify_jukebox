# Copy this file to .github/workflows/claude.yml in any repo that should get
# the Claude reviewer. All logic lives in Adermark/claude-review.
name: Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# The reusable workflow can't get more than this. Set contents: read to stop
# @claude from pushing commits when asked to fix something.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: Adermark/claude-review/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # Optional per-repo tweaks:
    # with:
    #   model: claude-opus-5-5
    #   extra_instructions: |
    #     This is a Python/Flask app; pay extra attention to SQL injection.
